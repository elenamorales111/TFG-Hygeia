<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Diseño responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título de la pestaña superior en el navegador -->
  <title>Login</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/images/hygeia_logo.png">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
  
  	/*Poner imagen de fondo en el body con una capa blanca clarita encima para 
	poder leer el texto*/
    body {
      background:
        linear-gradient(rgba(255, 255, 255, 0.70),
        rgba(255, 255, 255, 0.70)),
        url("../assets/images/index_image.png");

      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

	/*Degradado azul de Navbar superior*/
    .navbar {
      background: linear-gradient(90deg, #004aad, #005fd4);
    }
	
	/*HYGEIA en Navbar*/
    .navbar-brand {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      letter-spacing: 1px;
    }

	/*Tamaño logo Hygeia*/
    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
	
	/*Tipografía de los títulos y subtítulos*/
	h1, h2, h3, h4, h5, h6 {
	  font-family: "Playfair Display", serif;
	  color: #0b3d91;
	  font-weight: 700;
	}

	/*Cuadro de Login*/
    .login-card {
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 74, 173, 0.18);
    }

    .main-btn {
      background-color: #005fd4;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 600;
    }

    .main-btn:hover {
      background-color: #004aad;
    }
  </style>
</head>

<body>


  <!-- LOGIN -->
  <main class="container py-5">

    <section class="row justify-content-center align-items-center">

      <div class="col-md-7 col-lg-5">

        <div class="card login-card">

          <div class="card-body p-5">

            <h1 class="login-title text-center mb-2">
              Bienvenido
            </h1>

            <p class="text-center text-muted mb-4">
              Rellena los siguientes datos para acceder a tu cuenta
            </p>

			<p class="text-center mt-3">
				  ¿Eres médico?
				  <a href="./doctorLogin.html"  id="goDoctorLogin" class="text-decoration-none fw-semibold">
					Iniciar sesión como médico
				  </a>
				</p>

            <form id="loginForm">

              <div class="mb-3">
                <label for="email" class="form-label">
                  Email
                </label>

                <input
                  id="email"
                  type="email"
                  class="form-control"
                  placeholder="ejemplo: javier@gmail.com"
                  required
                >
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">
                  Contraseña
                </label>

                <input
                  id="password"
                  type="password"
                  class="form-control"
                  placeholder="Introduce tu contraseña"
                  required
                >
              </div>

              <button type="submit" class="btn btn-primary main-btn w-100">
                <i class="bi bi-door-open me-2"></i>
                Iniciar sesión
              </button>

              <p class="text-center mt-4 mb-0">
                ¿No tienes cuenta?
                <a href="register.html" class="text-decoration-none fw-semibold">
                  Regístrate
                </a>
              </p>

            </form>

            <div id="message" class="alert mt-4 d-none"></div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Login.js -->
  <script src="../js/login.js"></script>

</body>

</html>
