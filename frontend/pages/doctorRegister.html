<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Diseño responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título de la pestaña superior en el navegador -->
  <title>Registro</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/images/hygeia_logo.png">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>

    /*Poner imagen de fondo en el body con una capa blanca clarita encima para 
    poder leer el texto*/
    body {
      background:
        linear-gradient(rgba(255, 255, 255, 0.70),
        rgba(255, 255, 255, 0.70)),
        url("../assets/images/index_image.png");

      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

    /*Degradado azul de Navbar superior*/
    .navbar {
      background: linear-gradient(90deg, #004aad, #005fd4);
    }

    /*HYGEIA en Navbar*/
    .navbar-brand {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    /*Tamaño logo Hygeia*/
    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
	
	/*Tipografía de los títulos y subtítulos*/
	h1, h2, h3, h4, h5, h6 {
	  font-family: "Playfair Display", serif;
	  color: #0b3d91;
	  font-weight: 700;
	}

    /*Cuadro de Registro*/
    .register-card {
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 74, 173, 0.18);
    }

    .main-btn {
      background-color: #005fd4;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 600;
    }

    .main-btn:hover {
      background-color: #004aad;
    }

  </style>
</head>

<body>


  <!-- REGISTER -->
  <main class="container py-5">

    <section class="row justify-content-center align-items-center">

      <div class="col-md-9 col-lg-7">

        <div class="card register-card">

          <div class="card-body p-5">

            <h1 class="register-title text-center mb-2">
              Crear cuenta
            </h1>

            <p class="text-center text-muted mb-4">
              Rellena los siguientes datos para registrarte
            </p>


            <form id="doctorRegisterForm">

              <div class="row">

                <div class="col-md-6 mb-3">
                  <label for="name" class="form-label">
                    Nombre <span style="color:red">*</span>
                  </label>

                  <input
                    id="name"
                    type="text"
                    class="form-control"
                    placeholder="Introduce tu nombre"
                    required
                  >
                </div>

                <div class="col-md-6 mb-3">
                  <label for="surnames" class="form-label">
                    Apellidos <span style="color:red">*</span>
                  </label>

                  <input
                    id="surnames"
                    type="text"
                    class="form-control"
                    placeholder="Introduce tus apellidos"
                    required
                  >
                </div>

              </div>
			  
			<div class="row">

			  <div class="col-md-6 mb-3">
				<label for="dni" class="form-label">
				  DNI <span style="color:red">*</span>
				</label>

				<input
				  id="dni"
				  type="text"
				  class="form-control"
				  placeholder="ejemplo: 7277756A"
				  required
				>
			  </div>

			  <div class="col-md-6 mb-3">
				<label for="email" class="form-label">
				  Email <span style="color:red">*</span>
				</label>

				<input
				  id="email"
				  type="email"
				  class="form-control"
				  placeholder="ejemplo: javier@gmail.com"
				  required
				>
			  </div>

			</div>

          <div class="row">

			  <div class="col-md-6 mb-3">
				<label for="password" class="form-label">
				  Contraseña <span style="color:red">*</span>
				</label>

				<input
				  id="password"
				  type="password"
				  class="form-control"
				  placeholder="Introduce una contraseña"
				  required
				>
			  </div>

			  <div class="col-md-6 mb-3">
				<label for="speciality" class="form-label">
				  Especialidad <span style="color:red">*</span>
				</label>

				<input
				  id="speciality"
				  type="text"
				  class="form-control"
				  placeholder="ejemplo: Traumatología"
				  required
				>
			  </div>

			</div>

			<div class="mb-4">
			  <label for="medicalCenter" class="form-label">
				Centro médico <span style="color:red">*</span>
			  </label>

			  <input
				id="medicalCenter"
				type="text"
				class="form-control"
				placeholder="ejemplo: Hospital Universitario La Paz"
				required
			  >
			</div>
			
			<h5 class="mt-4 mb-3">Horario de trabajo <span style="color:red">*</span></h5>

				<div id="doctorTimetable">

				  <!-- Lunes -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="L">
					  <label for="L">Lunes</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="L_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="L_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				  <!-- Martes -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="M">
					  <label for="M">Martes</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="M_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="M_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				  <!-- Miércoles -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="X">
					  <label for="X">Miércoles</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="X_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="X_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				  <!-- Jueves -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="J">
					  <label for="J">Jueves</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="J_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="J_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				  <!-- Viernes -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="V">
					  <label for="V">Viernes</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="V_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="V_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				  <!-- Sábado -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="S">
					  <label for="S">Sábado</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="S_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="S_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				  <!-- Domingo -->
				  <div class="row align-items-center mb-2">
					<div class="col-md-3">
					  <input type="checkbox" id="D">
					  <label for="D">Domingo</label>
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="D_start"
						class="form-control"
						value="09:00"
					  >
					</div>

					<div class="col-md-4">
					  <input
						type="time"
						id="D_end"
						class="form-control"
						value="14:00"
					  >
					</div>
				  </div>

				</div>




              <button type="submit" class="btn btn-primary main-btn w-100">
                <i class="bi bi-person-plus me-2"></i>
                Registrarse
              </button>

			</form>

	<div id="message" class="alert mt-4 d-none"></div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- DoctorRegister.js -->
  <script src="../js/doctorRegister.js"></script>

</body>

</html>
