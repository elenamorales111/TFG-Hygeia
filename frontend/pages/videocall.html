<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <!-- Diseño responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Título -->
  <title>Videollamada | Hygeia</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/images/hygeia_logo.png">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- API de Jitsi -->
  <script src="https://meet.jit.si/external_api.js"></script>

  <style>

    body {

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.70),
          rgba(255, 255, 255, 0.70)
        ),
        url("../assets/images/index_image.png");

      background-size: cover;
      background-position: center;

      min-height: 100vh;

    }

    /* Navbar */
    .navbar {

      background:
        linear-gradient(
          90deg,
          #004aad,
          #005fd4
        );

    }
    .navbar-brand {

      font-family:
        "Playfair Display",
        serif;

      font-size: 2rem;

      letter-spacing: 1px;

    }

    .logo-img {

      width: 60px;

      height: 60px;

      object-fit: contain;

    }
	
	/*Tipografía de los títulos y subtítulos*/
	h1, h2, h3, h4, h5, h6 {
	  font-family: "Playfair Display", serif;
	  color: #0b3d91;
	  font-weight: 700;
	}

    /* Tarjeta */

    .video-card {

      border: none;

      border-radius: 24px;

      box-shadow:
        0 10px 30px
        rgba(
          0,
          74,
          173,
          0.18
        );

    }


    /* Contenedor de Jitsi */
    #jitsi-container {

      width: 100%;

      height: 650px;

      border-radius: 16px;

      overflow: hidden;

    }
	
	/*Footer*/
	footer {
      background-color: #00357a;
    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg navbar-dark shadow py-3">

    <div class="container">

      <a class="navbar-brand d-flex align-items-center gap-3"
         href="../../home.html">

        <img src="../assets/images/hygeia_logo.png"
             alt="Hygeia Logo"
             class="logo-img">

        <span>HYGEIA</span>

      </a>

    </div>

  </nav>

  <!-- CONTENIDO -->

  <main class="container py-5">

    <section class="row justify-content-center">

      <div class="col-lg-11">

        <div class="card video-card">

          <div class="card-body p-4">

            <h1 class="video-title text-center mb-2">

              Consulta médica por videollamada

            </h1>

			<p id="videocallMessage" class="text-center text-muted mb-4">

			  Espera a que tu médico se conecte para realizar una consulta médica

			</p>

            <div id="jitsi-container"></div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Comprobar si el usuario ha iniciado sesión para que este .html esté disponible -->
  <script src="../js/authentication.js"></script>
  
  <!-- Videocall.js -->

  <script src="../js/videocall.js"></script>




  <!-- FOOTER -->
  <footer class="text-white py-4 mt-5">

    <div class="container d-flex flex-column flex-md-row
      justify-content-between align-items-center gap-3">

      <div class="fw-bold d-flex align-items-center gap-2">

        <img src="../assets/images/hygeia_logo.png"
          alt="Logo"
          width="40">

        HYGEIA

      </div>

      <small>
        © 2026 Hygeia | Portal del Paciente
      </small>

    </div>

  </footer>

</body>


</html>
