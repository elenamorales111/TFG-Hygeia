<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Diseño responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título de la pestaña superior en el navegador -->
  <title>Mi Usuario</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/images/hygeia_logo.png">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>

    /*Poner imagen de fondo en el body con una capa blanca clarita encima para 
    poder leer el texto*/
    body {
      background:
        linear-gradient(rgba(255, 255, 255, 0.70),
        rgba(255, 255, 255, 0.70)),
        url("../assets/images/index_image.png");

      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

    /*Degradado azul de Navbar superior*/
    .navbar {
      background: linear-gradient(90deg, #004aad, #005fd4);
    }

    /*HYGEIA en Navbar*/
    .navbar-brand {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    /*Tamaño logo Hygeia*/
    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
	
	/*Tipografía de los títulos y subtítulos*/
	h1, h2, h3, h4, h5, h6 {
	  font-family: "Playfair Display", serif;
	  color: #0b3d91;
	  font-weight: 700;
	}

    /*Cuadro de Mi Usuario*/
    .user-card {
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 74, 173, 0.18);
    }

    .main-btn {
      background-color: #005fd4;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 600;
    }

    .main-btn:hover {
      background-color: #004aad;
    }
	
	/*Footer*/
	footer {
      background-color: #00357a;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow py-3">

    <!-- Container: Centra el contenido -->
    <div class="container">

      <a class="navbar-brand d-flex align-items-center gap-3" href="../../home.html">

        <img src="../assets/images/hygeia_logo.png" alt="Hygeia Logo" class="logo-img">

        <span>HYGEIA</span>

      </a>

      <div>
        <a href="../../home.html" class="btn btn-outline-light me-2">
          Home
        </a>

        <button   type="button" id="logoutBtn" class="btn btn-light">
          Cerrar sesión
        </button>
      </div>

    </div>

  </nav>

  <!-- MI USUARIO -->
  <main class="container py-5">

    <section class="row justify-content-center align-items-center">

      <div class="col-md-9 col-lg-7">

        <div class="card user-card">

          <div class="card-body p-5">

            <h1 class="user-title text-center mb-2">
              Mi Usuario
            </h1>

            <p class="text-center text-muted mb-4">
              Consulta y edita tus datos personales registrados en Hygeia
            </p>

            <form id="userForm">
			
			

              <div class="row">

                <div class="col-md-6 mb-3">
                  <label for="name" class="form-label">
                    Nombre <span style="color:red">*</span>
                  </label>

                  <input
                    id="name"
                    type="text"
                    class="form-control"
                    placeholder="Nombre"
					required
                    disabled
                  >
                </div>

                <div class="col-md-6 mb-3">
                  <label for="surnames" class="form-label">
                    Apellidos <span style="color:red">*</span>
                  </label>

                  <input
                    id="surnames"
                    type="text"
                    class="form-control"
                    placeholder="Apellidos"
					required
                    disabled
                  >
                </div>

              </div>

              <div class="row">

			  <div class="col-md-6 mb-3">
				<label for="dni" class="form-label">
				  DNI <span style="color:red">*</span>
				</label>

				<input
				  id="dni"
				  type="text"
				  class="form-control"
				  placeholder="DNI"
				  required
				  disabled
				>
			  </div>

			  <div class="col-md-6 mb-3">
				<label for="email" class="form-label">
				  Email <span style="color:red">*</span>
				</label>

				<input
				  id="email"
				  type="email"
				  class="form-control"
				  placeholder="Email"
				  required
				  disabled
				>
			  </div>

			</div>
			  
			  <!-- CAMPOS ÚNICOS DEL PACIENTE -->
		<div id="patientFields">

		  <div class="row">

			<div class="col-md-6 mb-3">
			  <label for="dateOfBirth" class="form-label">
				Fecha de nacimiento <span style="color:red">*</span>
			  </label>

			  <input
				id="dateOfBirth"
				type="date"
				class="form-control"
				required
				disabled
			  >
			</div>

			<div class="col-md-6 mb-3">
			  <label for="phoneNumber" class="form-label">
				Teléfono <span style="color:red">*</span>
			  </label>

			  <input
				id="phoneNumber"
				type="text"
				class="form-control"
				required
				disabled
			  >
			</div>

		  </div>

		  <div class="row">

			<div class="col-md-6 mb-3">
			  <label for="address" class="form-label">
				Dirección
			  </label>

			  <input
				id="address"
				type="text"
				class="form-control"
				disabled
			  >
			</div>

			<div class="col-md-6 mb-3">
			  <label for="postalCode" class="form-label">
				Código postal
			  </label>

			  <input
				id="postalCode"
				type="text"
				class="form-control"
				disabled
			  >
			</div>

		  </div>

		  <div class="row">

			<div class="col-md-6 mb-4">
			  <label for="province" class="form-label">
				Provincia <span style="color:red">*</span>
			  </label>

			  <input
				id="province"
				type="text"
				class="form-control"
				required
				disabled
			  >
			</div>

		  </div>

		</div>

		<!-- CAMPOS ÚNICOS DEL MÉDICO -->
		<div id="doctorFields" class="d-none">

		  <div class="row">

			<div class="col-md-6 mb-3">
			  <label for="speciality" class="form-label">
				Especialidad <span style="color:red">*</span>
			  </label>

			  <input
				id="speciality"
				type="text"
				class="form-control"
				placeholder="Especialidad"
				required
				disabled
			  >
			</div>

			<div class="col-md-6 mb-4">
			  <label for="medicalCenter" class="form-label">
				Centro médico <span style="color:red">*</span>
			  </label>

			  <input
				id="medicalCenter"
				type="text"
				class="form-control"
				placeholder="Centro médico"
				required
				disabled
			  >
			</div>

		  </div>

		</div>
		
		<div id="DoctorTimetableFields" class="d-none">
		
		<hr class="my-4">

		<h1 class="user-title text-center mb-2">
		  Horario de trabajo
		</h1>

		<p class="text-center text-muted mb-4">
		  Consulta y edita tu horario de trabajo
		</p>

		  <div class="row align-items-center mb-2">
			<div class="col-md-3">
			  <input type="checkbox" id="L_schedule" disabled>
			  <label for="L_schedule">Lunes</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="L_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="L_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		  <div class="row align-items-center mb-2">
			<div class="col-md-3">
			  <input type="checkbox" id="M_schedule" disabled>
			  <label for="M_schedule">Martes</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="M_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="M_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		  <div class="row align-items-center mb-2">
			<div class="col-md-3">
			  <input type="checkbox" id="X_schedule" disabled>
			  <label for="X_schedule">Miércoles</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="X_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="X_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		  <div class="row align-items-center mb-2">
			<div class="col-md-3">
			  <input type="checkbox" id="J_schedule" disabled>
			  <label for="J_schedule">Jueves</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="J_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="J_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		  <div class="row align-items-center mb-2">
			<div class="col-md-3">
			  <input type="checkbox" id="V_schedule" disabled>
			  <label for="V_schedule">Viernes</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="V_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="V_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		  <div class="row align-items-center mb-2">
			<div class="col-md-3">
			  <input type="checkbox" id="S_schedule" disabled>
			  <label for="S_schedule">Sábado</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="S_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="S_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		  <div class="row align-items-center mb-4">
			<div class="col-md-3">
			  <input type="checkbox" id="D_schedule" disabled>
			  <label for="D_schedule">Domingo</label>
			</div>
			<div class="col-md-4">
			  <input type="time" id="D_start" class="form-control" value="09:00" disabled>
			</div>
			<div class="col-md-4">
			  <input type="time" id="D_end" class="form-control" value="14:00" disabled>
			</div>
		  </div>

		</div>
		
		<!-- FICHA MÉDICA -->
		<div id="medicalRecordFields">

		  <hr class="my-4">

	      <h1 class="user-title text-center mb-2">
				  Ficha Médica
			</h1>
			
			<p class="text-center text-muted mb-4">
              Consulta y edita tu ficha médica
            </p>

		  <div class="row">

			<div class="col-md-6 mb-3">
			  <label for="illness" class="form-label">
				Enfermedad principal
			  </label>

			  <input id="illness" type="text" class="form-control" disabled>
			</div>

			<div class="col-md-6 mb-3">
			  <label for="status" class="form-label">
				Estado 
			  </label>

			  <input id="status" type="text" class="form-control" disabled>
			</div>

		  </div>

		  <div class="mb-3">
			<label for="medicalHistory" class="form-label">
			  Antecedentes médicos
			</label>

			<input id="medicalHistory" type="text" class="form-control" disabled>
		  </div>

		  <div class="row">

			<div class="col-md-6 mb-3">
			  <label for="bloodType" class="form-label">
				Grupo sanguíneo
			  </label>

			  <input id="bloodType" type="text" class="form-control" disabled>
			</div>

			<div class="col-md-6 mb-3">
			  <label for="allergies" class="form-label">
				Alergias
			  </label>

			  <input id="allergies" type="text" class="form-control" disabled>
			</div>

		  </div>

		  <div class="mb-3">
			<label for="medication" class="form-label">
			  Medicación habitual
			</label>

			<input id="medication" type="text" class="form-control" disabled>
		  </div>

		  <div class="row">

			<div class="col-md-6 mb-3">
			  <label for="healthInsurance" class="form-label">
				Seguro médico
			  </label>

			  <input id="healthInsurance" type="text" class="form-control" disabled>
			</div>

			<div class="col-md-6 mb-4">
			  <label for="familyDoctor" class="form-label">
				Médico de cabecera
			  </label>

			  <select id="familyDoctor" class="form-select" disabled>
			  <option value="">Selecciona un médico</option>
			</select>
			</div>

		  </div>

		</div>

              <div class="d-flex flex-column flex-md-row gap-3">

                <button type="button" id="editBtn" class="btn btn-primary main-btn w-100">
                  <i class="bi bi-pencil-square me-2"></i>
                  Editar datos
                </button>

                <button type="button" id="saveBtn" class="btn btn-success w-100 d-none">
                  <i class="bi bi-check-circle me-2"></i>
                  Guardar cambios
                </button>

              </div>

              <p class="text-center mt-4 mb-0">
                ¿Quieres volver a la página de inicio?
                <a href="../../home.html" class="text-decoration-none fw-semibold">
                  Volver a Home
                </a>
              </p>

            </form>

            <div id="message" class="alert mt-4 d-none"></div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Comprobar si el usuario ha iniciado sesión para que este .html esté disponible -->
  <script src="../js/authentication.js"></script>

  <!-- User.js -->
  <script src="../js/user.js"></script>






  <!-- FOOTER -->
  <footer class="text-white py-4 mt-5">

    <div class="container d-flex flex-column flex-md-row
      justify-content-between align-items-center gap-3">

      <div class="fw-bold d-flex align-items-center gap-2">

        <img src="../assets/images/hygeia_logo.png"
          alt="Logo"
          width="40">

        HYGEIA

      </div>

      <small>
        © 2026 Hygeia | Portal del Paciente
      </small>

    </div>

  </footer>
  
</body>

</html>
